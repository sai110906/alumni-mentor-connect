services:
  - type: web
    name: alumni-mentor-connect-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://alumni-mentor-connect.vercel.app
      - key: MONGODB_URI
        sync: false
